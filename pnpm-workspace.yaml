    typescript: *ts_common

# Solid's published compiler bridge still declares a beta-only peer range.
# The benchmark uses the RC required by @tsrx/solid; validate this exact pair
# with the full browser, SSR, and hydration suite when upgrading either side.
peerDependencyRules:
  allowedVersions:
    'vite-plugin-solid@3.0.0-next.5>solid-js': '2.0.0-rc.3'
    'vite-plugin-solid@3.0.0-next.5>@solidjs/web': '2.0.0-rc.3'
    'solid-refresh@0.8.0-next.7>solid-js': '2.0.0-rc.3'
