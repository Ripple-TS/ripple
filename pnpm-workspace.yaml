# DO NOT MOVE SECTIONS AROUND

# policies
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@sveltejs/acorn-typescript@1.0.13'
  - '@tsrx/core@0.1.67 || 0.1.69'
  - '@tsrx/eslint-parser@0.3.133'
  - '@tsrx/eslint-plugin@0.3.133'
  - '@tsrx/language-server@0.3.133'
  - '@tsrx/prettier-plugin@0.3.133'
  - '@tsrx/react@0.2.67'
  - '@tsrx/solid@0.1.67'
  - '@tsrx/typescript-plugin@0.3.133'
  - '@tsrx/vite-plugin-react@0.0.100'
  - '@tsrx/vite-plugin-solid@0.0.97'
  - '@tsrx/react-runtime@0.1.5'
  - '@tsrx/runtime@0.1.5 || 0.1.6'
  - '@tsrx/solid-runtime@0.1.5'
  - '@tsrx/ripple@0.1.63'
  - octane@0.2.4 || 0.2.6
minimumReleaseAgeIgnoreMissingTime: true
minimumReleaseAgeStrict: false
trustPolicy: no-downgrade
blockExoticSubdeps: true
verifyDepsBeforeRun: install
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
pmOnFail: download

allowBuilds:
  # Inferno ships built artifacts; its postinstall only prints a funding message.
  inferno: false
  bun: true
  esbuild: true
  sharp: true
  tldjs: true

# variables used in the catalog
prettier_common: &prettier_common ^3.9.6
ts_common: &ts_common ^5.9.3
ts_eslint_parser: &ts_eslint_parser ^8.56.1
esrap_common: &esrap_common ^2.3.2

packages:
  - packages/*
  - playground/ripple
  - website
  - website-new
  - benchmarks
  - benchmarks/*
  - benchmarks/*/*

overrides:
  'vite-plugin-solid@3.0.0-next.5>babel-preset-solid': '2.0.0-rc.2'
  esrap: *esrap_common
  semver: ^7.7.4
  # Solid 2.0 SSR alignment: vite-plugin-solid@3.0.0-next.5 pulls
  # babel-preset-solid@2.0.0-beta.7 transitively (→ babel-plugin-jsx-dom-expressions
  # 0.41, which still EMITS the `ssrRunInScope` SSR helper), but @solidjs/web@2.0.0-beta.15
  # REMOVED that export (dom-expressions 0.50 stopped emitting it). Force the
  # transform to the 0.50-era preset the catalog already intends so SSR output
  # matches the installed runtime. Without this, SSR throws "does not provide an
  # export named 'ssrRunInScope'". The preset version tracks the solid-js /
  # @solidjs/web beta below; babel-plugin-jsx-dom-expressions tracks the
  # preset's own dependency range.
  babel-preset-solid: '2.0.0-beta.15'
  babel-plugin-jsx-dom-expressions: '0.50.0-next.14'

catalogs:
  benchmarks:
    '@babel/core': '7.29.7'
    '@preact/preset-vite': '2.10.6'
    '@solidjs/web': '2.0.0-rc.3'
    '@sveltejs/vite-plugin-svelte': '7.2.0'
    '@tsrx/react': '0.2.67'
    '@tsrx/solid': '0.1.67'
    '@tsrx/vite-plugin-react': '0.0.100'
    '@tsrx/vite-plugin-solid': '0.0.97'
    '@vitejs/plugin-react': '6.0.3'
    '@vitejs/plugin-vue': '6.0.8'
    '@vue/runtime-dom': '3.6.0-rc.1'
    '@vue/runtime-vapor': '3.6.0-rc.1'
    esbuild: '0.28.1'
    inferno: '9.1.0'
    inferno-create-element: '9.1.0'
    inferno-hydrate: '9.1.0'
    inferno-server: '9.1.0'
    playwright: '1.63.0'
    preact: '10.29.8'
