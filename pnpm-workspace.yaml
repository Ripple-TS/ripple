# DO NOT MOVE SECTIONS AROUND

# policies
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@sveltejs/acorn-typescript@1.0.13'
  - '@tsrx/core@0.1.67 || 0.1.69'
  - '@tsrx/eslint-parser@0.3.133'
  - '@tsrx/eslint-plugin@0.3.133'
  - '@tsrx/language-server@0.3.133'
  - '@tsrx/prettier-plugin@0.3.133'
  - '@tsrx/react@0.2.67'
  - '@tsrx/solid@0.1.67'
  - '@tsrx/typescript-plugin@0.3.133'
  - '@tsrx/vite-plugin-react@0.0.100'
  - '@tsrx/vite-plugin-solid@0.0.97'
  - '@tsrx/react-runtime@0.1.5'
  - '@tsrx/runtime@0.1.5 || 0.1.6'
  - '@tsrx/solid-runtime@0.1.5'
  - '@tsrx/ripple@0.1.63 || 0.1.65'
  - octane@0.2.4 || 0.2.6
  # Solid 2.0.0-rc.7 (released 2026-09-08); vite-plugin-solid stays on next.26,
  # the last release with provenance (next.27 has none and trips trustPolicy).
  - solid-js@2.0.0-rc.7
  - '@solidjs/web@2.0.0-rc.7'
  - '@solidjs/signals@2.0.0-rc.7'
  - babel-preset-solid@2.0.0-rc.2
minimumReleaseAgeIgnoreMissingTime: true
minimumReleaseAgeStrict: false
trustPolicy: no-downgrade
blockExoticSubdeps: true
verifyDepsBeforeRun: install
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
pmOnFail: download

allowBuilds:
  # Inferno ships built artifacts; its postinstall only prints a funding message.
  inferno: false
  bun: true
  esbuild: true
  sharp: true
  tldjs: true

# variables used in the catalog
prettier_common: &prettier_common ^3.9.6
ts_common: &ts_common '>=5.9.3'
ts_eslint_parser: &ts_eslint_parser ^8.56.1
esrap_common: &esrap_common ^2.3.2

packages:
  - packages/*
  - playground/ripple
  - website
  - website-new
  - benchmarks
  - benchmarks/*
  - benchmarks/*/*

overrides:
  esrap: *esrap_common
  semver: ^7.7.4

catalogs:
  benchmarks:
    '@babel/core': '7.29.7'
    '@preact/preset-vite': '2.10.6'
    '@solidjs/web': '2.0.0-rc.7'
    '@sveltejs/vite-plugin-svelte': '7.2.0'
    '@tsrx/react': '0.2.67'
    '@tsrx/solid': '0.1.67'
    '@tsrx/vite-plugin-react': '0.0.100'
    '@tsrx/vite-plugin-solid': '0.0.97'
    '@vitejs/plugin-react': '6.0.3'
    '@vitejs/plugin-vue': '6.0.8'
    '@vue/runtime-dom': '3.6.0-rc.1'
    '@vue/runtime-vapor': '3.6.0-rc.1'
    esbuild: '0.28.1'
    inferno: '9.1.0'
    inferno-create-element: '9.1.0'
    inferno-hydrate: '9.1.0'
    inferno-server: '9.1.0'
    playwright: '1.63.0'
    preact: '10.29.8'
    preact-render-to-string: '6.7.0'
    react: '19.2.7'
    react-dom: '19.2.7'
    solid-js: '2.0.0-rc.7'
    svelte: '5.56.7'
    typescript: '5.9.3'
    vite: '8.1.5'
    vite-plugin-solid: '3.0.0-next.26'
    vue: '3.6.0-rc.1'
  default:
    '@babel/core': ^7.29.0
    '@changesets/changelog-github': ^0.7.0
    '@changesets/cli': ^2.31.0
    '@rollup/pluginutils': ^5.3.0
    '@solidjs/web': '2.0.0-beta.15'
    '@tailwindcss/vite': ^4.1.12
    '@types/bun': ^1.3.9
    '@types/estree': ^1.0.8
    '@types/estree-jsx': ^1.0.5
    '@types/node': ^24.3.0
    '@types/prompts': ^2.4.9
    '@tsrx/core': ^0.1.67
    '@tsrx/eslint-plugin': ^0.3.133
    '@tsrx/language-server': ^0.3.133
    '@tsrx/prettier-plugin': ^0.3.133
    '@tsrx/react': ^0.2.67
    '@tsrx/solid': ^0.1.67
    '@tsrx/typescript-plugin': ^0.3.133
    '@tsrx/vite-plugin-react': ^0.0.100
    '@tsrx/vite-plugin-solid': ^0.0.97
    '@typescript-eslint/parser': *ts_eslint_parser
    '@typescript-eslint/types': ^8.40.0
    '@vercel/nft': ^1.3.2
    '@volar/language-core': ~2.4.28
    babel-preset-solid: '2.0.0-beta.15'
    clsx: ^2.1.1
    commander: ^14.0.3
    degit: ^2.8.4
    devalue: ^5.8.1
    eslint: ^10.3.0
    esm-env: ^1.2.2
    esrap: *esrap_common
    is-reference: ^3.0.3
    jsdom: ^29.0.2
    kleur: ^4.1.5
    linkedom: ^0.18.12
    livecodes: 0.13.0
    marked: ^17.0.3
    ora: ^9.3.0
    playwright: ^1.61.0
    polka: ^1.0.0-next.25
    prettier: *prettier_common
    prompts: ^2.4.2
    react: ^19.2.0
    react-dom: ^19.2.0
    rollup: ^4.59.0
    rulesync: ^8.17.0
    shiki: 4.0.1
    solid-js: '2.0.0-beta.15'
    source-map: ^0.7.6
    tsdown: ^0.22.0
    type-fest: ^5.6.0
    typescript: *ts_common
    uvu: ^0.5.6
    vite: ^8.1.5
    vitepress: 2.0.0-alpha.12
    vitepress-plugin-npm-commands: ^0.9.0
    vitepress-plugin-tabs: ^0.8.0
    vitest: ^4.1.6
    vscode-languageserver-types: ^3.17.5
    wait-on: ^9.0.10
    zimmerframe: ^1.1.2
  peer:
    '@typescript-eslint/parser': *ts_eslint_parser
    eslint: '>=9.0.0'
    prettier: '>=2.0.0'
    ripple: '*'
    tailwindcss: ^4.1.12
    typescript: '>=5.9.3'

# vite-plugin-solid's peer range `<2.0.0-experimental.0` excludes `rc.*` by
# prerelease ordering, and @tsrx/solid / @tsrx/solid-runtime pin an exact older
# RC; the benchmarks run the current RC. Validate the pair with the browser,
# SSR, and hydration suites when upgrading either side.
peerDependencyRules:
  allowedVersions:
    'vite-plugin-solid@3.0.0-next.26>solid-js': '2.0.0-rc.7'
    'vite-plugin-solid@3.0.0-next.26>@solidjs/web': '2.0.0-rc.7'
    '@tsrx/solid>solid-js': '2.0.0-rc.7'
    '@tsrx/solid>@solidjs/web': '2.0.0-rc.7'
    '@tsrx/solid-runtime>solid-js': '2.0.0-rc.7'
    '@tsrx/solid-runtime>@solidjs/web': '2.0.0-rc.7'
