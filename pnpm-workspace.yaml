    '@types/bun': ^1.3.9
    '@types/estree': ^1.0.8
    '@types/estree-jsx': ^1.0.5
    '@types/node': ^24.3.0
    '@types/prompts': ^2.4.9
    '@tsrx/core': ^0.1.67
    '@tsrx/eslint-plugin': ^0.3.133
    '@tsrx/language-server': ^0.3.133
    '@tsrx/prettier-plugin': ^0.3.133
    '@tsrx/react': ^0.2.67
    '@tsrx/solid': ^0.1.67
    '@tsrx/typescript-plugin': ^0.3.133
    '@tsrx/vite-plugin-react': ^0.0.100
