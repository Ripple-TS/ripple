# DO NOT MOVE SECTIONS AROUND

# policies
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@sveltejs/acorn-typescript@1.0.13'
  - '@tsrx/core@0.1.61'
  - '@tsrx/eslint-parser@0.3.126'
  - '@tsrx/eslint-plugin@0.3.126'
  - '@tsrx/language-server@0.3.126'
  - '@tsrx/prettier-plugin@0.3.126'
  - '@tsrx/react@0.2.61'
  - '@tsrx/solid@0.1.61'
  - '@tsrx/typescript-plugin@0.3.126'
  - '@tsrx/vite-plugin-react@0.0.94'
  - '@tsrx/vite-plugin-solid@0.0.91'
minimumReleaseAgeIgnoreMissingTime: true
minimumReleaseAgeStrict: false
trustPolicy: no-downgrade
blockExoticSubdeps: true
verifyDepsBeforeRun: install
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
pmOnFail: download

allowBuilds:
  bun: true
  esbuild: true
  sharp: true
  tldjs: true

# variables used in the catalog
prettier_common: &prettier_common ^3.9.6
ts_common: &ts_common ^5.9.3
ts_eslint_parser: &ts_eslint_parser ^8.56.1
esrap_common: &esrap_common ^2.3.2

packages:
  - packages/*
  - playground/ripple
  - website
  - website-new
  - benchmarks
  - benchmarks/recursive-context
  - benchmarks/recursive-context/*
  - benchmarks/signal-favoring
  - benchmarks/signal-favoring/*
  - benchmarks/news
  - benchmarks/news/*
  - benchmarks/for-reconcile
  - benchmarks/for-reconcile/*
  - benchmarks/streaming-ssr

overrides:
  esrap: *esrap_common
  semver: ^7.7.4
  # Solid 2.0 SSR alignment: vite-plugin-solid@3.0.0-next.5 pulls
  # babel-preset-solid@2.0.0-beta.7 transitively (→ babel-plugin-jsx-dom-expressions
  # 0.41, which still EMITS the `ssrRunInScope` SSR helper), but @solidjs/web@2.0.0-beta.15
  # REMOVED that export (dom-expressions 0.50 stopped emitting it). Force the
  # transform to the 0.50-era preset the catalog already intends so SSR output
  # matches the installed runtime. Without this, SSR throws "does not provide an
  # export named 'ssrRunInScope'". The preset version tracks the solid-js /
  # @solidjs/web beta below; babel-plugin-jsx-dom-expressions tracks the
  # preset's own dependency range.
  babel-preset-solid: '2.0.0-beta.15'
  babel-plugin-jsx-dom-expressions: '0.50.0-next.14'

catalogs:
  default:
    '@babel/core': ^7.29.0
    '@changesets/changelog-github': ^0.7.0
    '@changesets/cli': ^2.31.0
    '@rollup/pluginutils': ^5.3.0
    '@solidjs/web': '2.0.0-beta.15'
    '@tailwindcss/vite': ^4.1.12
    '@types/bun': ^1.3.9
    '@types/estree': ^1.0.8
    '@types/estree-jsx': ^1.0.5
    '@types/node': ^24.3.0
    '@types/prompts': ^2.4.9
    '@tsrx/core': ^0.1.61
    '@tsrx/eslint-plugin': ^0.3.126
    '@tsrx/language-server': ^0.3.126
    '@tsrx/prettier-plugin': ^0.3.126
    '@tsrx/react': ^0.2.61
    '@tsrx/solid': ^0.1.61
    '@tsrx/typescript-plugin': ^0.3.126
    '@tsrx/vite-plugin-react': ^0.0.94
    '@tsrx/vite-plugin-solid': ^0.0.91
    '@typescript-eslint/parser': *ts_eslint_parser
    '@typescript-eslint/types': ^8.40.0
    '@vercel/nft': ^1.3.2
    '@volar/language-core': ~2.4.28
    babel-preset-solid: '2.0.0-beta.15'
    clsx: ^2.1.1
    commander: ^14.0.3
    degit: ^2.8.4
    devalue: ^5.8.1
    eslint: ^10.3.0
    esm-env: ^1.2.2
    esrap: *esrap_common
    is-reference: ^3.0.3
    jsdom: ^29.0.2
    kleur: ^4.1.5
    linkedom: ^0.18.12
    livecodes: 0.13.0
    marked: ^17.0.3
    ora: ^9.3.0
    playwright: ^1.61.0
    polka: ^1.0.0-next.25
    prettier: *prettier_common
    prompts: ^2.4.2
    react: ^19.2.0
    react-dom: ^19.2.0
    rollup: ^4.59.0
    rulesync: ^8.17.0
    shiki: 4.0.1
    solid-js: '2.0.0-beta.15'
    source-map: ^0.7.6
    tsdown: ^0.22.0
