name: Publish

on:
  push:
    branches:
      - main

concurrency:
  group: npm-publish

permissions: {}

jobs:
  publish:
    if: github.repository == 'Ripple-TS/ripple' && contains(github.event.head_commit.message, 'Version Packages')
    permissions:
      contents: write
      id-token: write
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          # Do not enable dependency caching in this workflow. This job has
          # id-token: write and publishes to npm, so restoring shared Actions
          # cache here can turn cache poisoning into a trusted publish compromise.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Disallow major bumps in changesets
        run: pnpm changeset:check

      - name: Publish to npm
        id: changesets
        # v2 is required with @changesets/cli 3: the CLI no longer prints the
        # `New tag:` lines that v1 parsed, so v1 would publish to npm and then
        # create no git tags or GitHub releases. v2 reads the CLI's NDJSON
        # output (via CHANGESETS_OUTPUT) and pushes tags through the GitHub API
        # with the default token.
        uses: changesets/action@v2
        with:
          publish-script: pnpm changeset:publish
        env:
          PNPM_CONFIG_PROVENANCE: true
          # keep for now just in case
          NPM_CONFIG_PROVENANCE: true
